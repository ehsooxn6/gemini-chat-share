<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Live Chat</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f0f2f5;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        background: #fff;
        padding: 12px 15px;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header-title {
        font-weight: bold;
        font-size: 1.05rem;
      }
      .clear-btn {
        background: #ff4d4f;
        color: #fff;
        border: 0;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: bold;
        cursor: pointer;
      }
      .clear-btn:hover {
        background: #d9363e;
      }
      #chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .msg {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 16px;
        font-size: 0.95rem;
        line-height: 1.4;
        word-break: break-word;
      }
      .msg.user {
        align-self: flex-end;
        background: #0084ff;
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .msg.gemini {
        align-self: flex-start;
        background: #fff;
        color: #333;
        border: 1px solid #e0e0e0;
        border-bottom-left-radius: 4px;
      }
      .msg.system {
        align-self: center;
        background: #e4e6eb;
        color: #65676b;
        font-size: 0.8rem;
        border-radius: 12px;
        text-align: center;
      }
      .sender-name {
        font-size: 0.75rem;
        color: #888;
        margin-bottom: 3px;
      }
      .sources {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 8px;
        padding-top: 7px;
        border-top: 1px solid #eee;
        font-size: 0.78rem;
      }
      .source-link {
        color: #3578c9;
        text-decoration: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .source-link:hover {
        text-decoration: underline;
      }
      #input-area {
        background: #fff;
        padding: 12px;
        border-top: 1px solid #e0e0e0;
        display: flex;
        gap: 8px;
      }
      #name-input {
        width: 70px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 8px;
        text-align: center;
      }
      #message-input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 1rem;
        outline: 0;
      }
      #send-btn {
        padding: 10px 16px;
        background: #0084ff;
        color: #fff;
        border: 0;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
      }
      #send-btn:disabled {
        background: #ccc;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="header-title">Gemini Live Chat</span
      ><button class="clear-btn" onclick="clearChatHistory()">Clear</button>
    </header>
    <div id="chat-box">
      <div class="msg system">Welcome. This chat is shared in real time.</div>
    </div>
    <div id="input-area">
      <input
        type="text"
        id="name-input"
        value="Anonymous"
        placeholder="Name"
      /><input
        type="text"
        id="message-input"
        placeholder="Ask Gemini..."
        onkeypress="if (event.key === 'Enter') sendMessage();"
      /><button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyApfX-vV9xNdHxwh2NAxJQEmLmDKXSwH_0",
        authDomain: "gemini-chat-share.firebaseapp.com",
        databaseURL:
          "https://gemini-chat-share-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "gemini-chat-share",
        storageBucket: "gemini-chat-share.firebasestorage.app",
        messagingSenderId: "438937384325",
        appId: "1:438937384325:web:426b9a22b3c30ac32f00ec",
      };
      const GEMINI_MODEL = "gemini-3.6-flash";
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const chatRef = db.ref("chats");
      const chatBox = document.getElementById("chat-box");
      const messageInput = document.getElementById("message-input");
      const nameInput = document.getElementById("name-input");
      const sendBtn = document.getElementById("send-btn");

      chatRef.on("child_added", (snapshot) => {
        const data = snapshot.val();
        appendMessage(data.sender, data.text, data.type, data.sources);
      });
      chatRef.on("value", (snapshot) => {
        if (!snapshot.exists())
          chatBox.innerHTML =
            '<div class="msg system">Chat history was cleared.</div>';
      });
      function appendMessage(sender, text, type, sources = []) {
        const msgDiv = document.createElement("div");
        msgDiv.classList.add("msg", type);
        if (type !== "system") {
          const nameDiv = document.createElement("div");
          nameDiv.classList.add("sender-name");
          nameDiv.innerText = sender;
          msgDiv.appendChild(nameDiv);
        }
        const textDiv = document.createElement("div");
        textDiv.innerText = text;
        msgDiv.appendChild(textDiv);
        if (type === "gemini" && Array.isArray(sources) && sources.length) {
          const sourcesDiv = document.createElement("div");
          sourcesDiv.classList.add("sources");
          sources.forEach((source) => {
            if (!source?.uri) return;
            const sourceLink = document.createElement("a");
            sourceLink.classList.add("source-link");
            sourceLink.href = source.uri;
            sourceLink.target = "_blank";
            sourceLink.rel = "noopener noreferrer";
            sourceLink.textContent = `\uD83D\uDD0D \uCD9C\uCC98: ${source.title || source.uri}`;
            sourcesDiv.appendChild(sourceLink);
          });
          if (sourcesDiv.childElementCount) msgDiv.appendChild(sourcesDiv);
        }
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }
      async function clearChatHistory() {
        if (confirm("Clear all chat history?")) await chatRef.remove();
      }
      async function sendMessage() {
        const text = messageInput.value.trim();
        const sender = nameInput.value.trim() || "Anonymous";
        if (!text) return;
        messageInput.value = "";
        sendBtn.disabled = true;
        const snapshot = await chatRef.once("value");
        const currentChats = snapshot.val() || {};
        const contentsHistory = [];
        Object.values(currentChats).forEach((msg) => {
          if (msg.type === "user")
            contentsHistory.push({
              role: "user",
              parts: [{ text: `[Sender: ${msg.sender}] ${msg.text}` }],
            });
          else if (msg.type === "gemini")
            contentsHistory.push({
              role: "model",
              parts: [{ text: msg.text }],
            });
        });
        contentsHistory.push({
          role: "user",
          parts: [{ text: `[Sender: ${sender}] ${text}` }],
        });
        await chatRef.push({
          sender,
          text,
          type: "user",
          timestamp: Date.now(),
        });
        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: GEMINI_MODEL,
              contents: contentsHistory,
              tools: [{ googleSearch: {} }],
            }),
          });
          const data = await response.json();
          const replyText =
            data.candidates?.[0]?.content?.parts?.[0]?.text ||
            "Gemini did not return a response.";
          const sources = (
            data.candidates?.[0]?.groundingMetadata?.groundingChunks || []
          )
            .map((chunk) => ({ title: chunk.web?.title, uri: chunk.web?.uri }))
            .filter((source) => source.uri);
          await chatRef.push({
            sender: "Gemini",
            text: replyText,
            type: "gemini",
            sources,
            timestamp: Date.now(),
          });
        } catch (error) {
          console.error(error);
          await chatRef.push({
            sender: "System",
            text: "An error occurred while calling Gemini.",
            type: "system",
            timestamp: Date.now(),
          });
        } finally {
          sendBtn.disabled = false;
        }
      }
    </script>
  </body>
</html>
