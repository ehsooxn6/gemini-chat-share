<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Live Chat</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f0f2f5;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        background: #fff;
        padding: 12px 15px;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .header-title {
        font-weight: bold;
        font-size: 1.05rem;
      }
      .clear-btn {
        background: #ff4d4f;
        color: #fff;
        border: 0;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: bold;
        cursor: pointer;
      }
      .clear-btn:hover {
        background: #d9363e;
      }
      #chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .msg {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 16px;
        font-size: 0.95rem;
        line-height: 1.4;
        word-break: break-word;
      }
      .msg.user {
        align-self: flex-end;
        background: #0084ff;
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .msg.gemini {
        align-self: flex-start;
        background: #fff;
        color: #333;
        border: 1px solid #e0e0e0;
        border-bottom-left-radius: 4px;
      }
      .msg.system {
        align-self: center;
        background: #e4e6eb;
        color: #65676b;
        font-size: 0.8rem;
        border-radius: 12px;
        text-align: center;
      }
      .sender-name {
        font-size: 0.75rem;
        color: #888;
        margin-bottom: 3px;
      }
      .sources {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 8px;
        padding-top: 7px;
        border-top: 1px solid #eee;
        font-size: 0.78rem;
      }
      .source-link {
        color: #3578c9;
        text-decoration: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .source-link:hover {
        text-decoration: underline;
      }
      #input-area {
        background: #fff;
        padding: 12px;
        border-top: 1px solid #e0e0e0;
        display: flex;
        gap: 8px;
      }
      #name-input {
        width: 70px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 8px;
        text-align: center;
      }
      #message-input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 1rem;
        outline: 0;
      }
      #send-btn {
        padding: 10px 16px;
        background: #0084ff;
        color: #fff;
        border: 0;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
      }
      #send-btn:disabled {
        background: #ccc;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="header-title">Gemini Live Chat</span
      ><button class="clear-btn" onclick="clearChatHistory()">Clear</button>
    </header>
    <div id="chat-box">
      <div class="msg system">Welcome. This chat is shared in real time.</div>
    </div>
    <div id="input-area">
      <input
        type="text"
        id="name-input"
        value="Anonymous"
        placeholder="Name"
      /><input
        type="text"
        id="message-input"
        placeholder="Ask Gemini..."
        onkeypress="if (event.key === 'Enter') sendMessage();"
      /><button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyApfX-vV9xNdHxwh2NAxJQEmLmDKXSwH_0",
        authDomain: "gemini-chat-share.firebaseapp.com",
        databaseURL:
          "https://gemini-chat-share-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "gemini-chat-share",
        storageBucket: "gemini-chat-share.firebasestorage.app",
        messagingSenderId: "438937384325",
        appId: "1:438937384325:web:426b9a22b3c30ac32f00ec",
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const chatRef = db.ref("chats");
      const modelQuotaRef = db.ref("modelQuota");
      const chatBox = document.getElementById("chat-box");
      const messageInput = document.getElementById("message-input");
      const nameInput = document.getElementById("name-input");
      const sendBtn = document.getElementById("send-btn");
      const MODEL_DAILY_LIMITS = {
        "gemini-3.6-flash": 20,
        "gemini-3.5-flash": 20,
        "gemini-3.5-flash-lite": 500,
        "gemini-3.1-flash-lite": 500,
      };
      let quotaDate = "";
      let quotaState = {};
      let quotaListener;
      let quotaStateReady = Promise.resolve();

      function getPacificDateKey() {
        const values = Object.fromEntries(
          new Intl.DateTimeFormat("en-US", {
            timeZone: "America/Los_Angeles",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
          })
            .formatToParts(new Date())
            .filter(({ type }) => type !== "literal")
            .map(({ type, value }) => [type, value]),
        );

        return `${values.year}-${values.month}-${values.day}`;
      }

      function syncQuotaState() {
        const nextQuotaDate = getPacificDateKey();
        if (quotaDate === nextQuotaDate) return quotaStateReady;

        if (quotaListener) {
          modelQuotaRef.child(quotaDate).off("value", quotaListener);
        }

        quotaDate = nextQuotaDate;
        quotaState = {};
        quotaStateReady = new Promise((resolve) => {
          quotaListener = (snapshot) => {
            quotaState = snapshot.val() || {};
            resolve();
          };
        });
        modelQuotaRef.child(quotaDate).on("value", quotaListener);
        return quotaStateReady;
      }

      function getModelKey(model) {
        return model.replace(/[.#$\[\]]/g, "_");
      }

      function getModelState(model) {
        return quotaState[getModelKey(model)] || {};
      }

      function getExcludedModels() {
        const now = Date.now();
        return Object.values(quotaState)
          .filter(
            (state) =>
              state?.disabledUntil > now ||
              state?.count >= MODEL_DAILY_LIMITS[state?.model],
          )
          .map((state) => state.model)
          .filter(Boolean);
      }

      function getUsageCounts() {
        return Object.fromEntries(
          Object.values(quotaState)
            .filter((state) => state?.model)
            .map((state) => [
            state.model,
            Number(state?.count) || 0,
          ]),
        );
      }

      function getFailureCounts() {
        return Object.fromEntries(
          Object.values(quotaState)
            .filter((state) => state?.model)
            .map((state) => [
            state.model,
            Number(state?.failureCount) || 0,
          ]),
        );
      }

      function storeCooldowns(modelCooldowns) {
        if (!modelCooldowns?.length) return;

        modelCooldowns.forEach(
          ({ model, disabledUntil, isDailyExclusion, trackFailure }) => {
          const key = getModelKey(model);
          const failureCount = Number(quotaState[key]?.failureCount) || 0;
          quotaState[key] = {
            ...(quotaState[key] || {}),
            model,
            disabledUntil: Math.max(
              quotaState[key]?.disabledUntil || 0,
              disabledUntil,
            ),
            failureCount: isDailyExclusion
              ? 2
              : trackFailure
                ? failureCount + 1
                : failureCount,
          };
          modelQuotaRef
            .child(quotaDate)
            .child(key)
            .transaction((state) => ({
              ...(state || {}),
              model,
              disabledUntil: Math.max(state?.disabledUntil || 0, disabledUntil),
              failureCount: isDailyExclusion
                ? 2
                : trackFailure
                  ? (Number(state?.failureCount) || 0) + 1
                  : Number(state?.failureCount) || 0,
            }));
          },
        );
      }

      function recordModelUsage(model, quotaResetAt) {
        if (!model) return;

        const dailyLimit = MODEL_DAILY_LIMITS[model];
        const key = getModelKey(model);
        const state = getModelState(model);
        const count = (Number(state.count) || 0) + 1;
        quotaState[key] = {
          ...state,
          model,
          count,
          disabledUntil:
            dailyLimit && count >= dailyLimit
              ? Math.max(state.disabledUntil || 0, quotaResetAt)
              : state.disabledUntil || 0,
          failureCount: 0,
        };

        modelQuotaRef
          .child(quotaDate)
          .child(key)
          .transaction((state) => {
            const count = (Number(state?.count) || 0) + 1;

            return {
              ...(state || {}),
              model,
              count,
              disabledUntil:
                dailyLimit && count >= dailyLimit
                  ? Math.max(state?.disabledUntil || 0, quotaResetAt)
                  : state?.disabledUntil || 0,
              failureCount: 0,
            };
          });
      }

      syncQuotaState();

      chatRef.on("child_added", (snapshot) => {
        const data = snapshot.val();
        appendMessage(data.sender, data.text, data.type, data.sources);
      });
      chatRef.on("value", (snapshot) => {
        if (!snapshot.exists())
          chatBox.innerHTML =
            '<div class="msg system">Chat history was cleared.</div>';
      });
      function appendMessage(sender, text, type, sources = []) {
        const msgDiv = document.createElement("div");
        msgDiv.classList.add("msg", type);
        if (type !== "system") {
          const nameDiv = document.createElement("div");
          nameDiv.classList.add("sender-name");
          nameDiv.innerText = sender;
          msgDiv.appendChild(nameDiv);
        }
        const textDiv = document.createElement("div");
        textDiv.innerText = text;
        msgDiv.appendChild(textDiv);
        if (type === "gemini" && Array.isArray(sources) && sources.length) {
          const sourcesDiv = document.createElement("div");
          sourcesDiv.classList.add("sources");
          sources.forEach((source) => {
            if (!source?.uri) return;
            const sourceLink = document.createElement("a");
            sourceLink.classList.add("source-link");
            sourceLink.href = source.uri;
            sourceLink.target = "_blank";
            sourceLink.rel = "noopener noreferrer";
            sourceLink.textContent = `\uD83D\uDD0D \uCD9C\uCC98: ${source.title || source.uri}`;
            sourcesDiv.appendChild(sourceLink);
          });
          if (sourcesDiv.childElementCount) msgDiv.appendChild(sourcesDiv);
        }
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }
      async function clearChatHistory() {
        if (confirm("Clear all chat history?")) await chatRef.remove();
      }
      async function sendMessage() {
        const text = messageInput.value.trim();
        const sender = nameInput.value.trim() || "Anonymous";
        if (!text) return;
        messageInput.value = "";
        sendBtn.disabled = true;
        await syncQuotaState();
        const snapshot = await chatRef.limitToLast(60).once("value");
        const currentChats = snapshot.val() || {};
        const contentsHistory = Object.values(currentChats)
          .filter((msg) => msg.type === "user" || msg.type === "gemini")
          .slice(-19)
          .map((msg) => {
          if (msg.type === "user")
            return {
              role: "user",
              parts: [{ text: `[Sender: ${msg.sender}] ${msg.text}` }],
            };
          return {
              role: "model",
              parts: [{ text: msg.text }],
            };
          });
        while (contentsHistory[0]?.role === "model") contentsHistory.shift();
        contentsHistory.push({
          role: "user",
          parts: [{ text: `[Sender: ${sender}] ${text}` }],
        });
        await chatRef.push({
          sender,
          text,
          type: "user",
          timestamp: Date.now(),
        });
        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: contentsHistory,
              excludedModels: getExcludedModels(),
              usageCounts: getUsageCounts(),
              failureCounts: getFailureCounts(),
            }),
          });
          const data = await response.json();
          storeCooldowns(data.modelCooldowns);
          if (!response.ok) {
            console.error({
              message: data.error?.message,
              attemptedModels: data.attemptedModels,
              modelCooldowns: data.modelCooldowns,
            });
            throw new Error(data.error?.message || "Gemini request failed.");
          }
          const replyText =
            data.candidates?.[0]?.content?.parts?.[0]?.text ||
            "Gemini did not return a response.";
          const sources = (
            data.candidates?.[0]?.groundingMetadata?.groundingChunks || []
          )
            .map((chunk) => ({ title: chunk.web?.title, uri: chunk.web?.uri }))
            .filter((source) => source.uri);
          await chatRef.push({
            sender: "Gemini",
            text: replyText,
            type: "gemini",
            sources,
            model: data.modelUsed,
            timestamp: Date.now(),
          });
          recordModelUsage(data.modelUsed, data.quotaResetAt);
        } catch (error) {
          console.error(error);
          await chatRef.push({
            sender: "System",
            text: `Gemini request failed: ${error.message}`,
            type: "system",
            timestamp: Date.now(),
          });
        } finally {
          sendBtn.disabled = false;
        }
      }
    </script>
  </body>
</html>
